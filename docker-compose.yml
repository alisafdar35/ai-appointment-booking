# Local development dependencies only. Production uses managed Postgres (Neon).
services:
  postgres:
    image: postgres:16-alpine
    container_name: appt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appt
      POSTGRES_PASSWORD: appt_local_dev
      POSTGRES_DB: appt
    ports:
      - "5433:5432"
    volumes:
      - appt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appt -d appt"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  appt_pgdata:
